[project]
name = "follow"
dynamic = ["version"]
description = "Git-like tracking for scientific experiments: intent, structure, evidence and conclusions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DmHoly", email = "mehdi.daanoune@gmail.com" },
]
keywords = [
    "experiment-tracking",
    "version-control",
    "reproducibility",
    "research",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "pydantic>=2.7",
    "plotly>=5.20",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/DmHoly/Follow"
Repository = "https://github.com/DmHoly/Follow"
Issues = "https://github.com/DmHoly/Follow/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "questionary>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]
menu = [
    "questionary>=2.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
follow = "follow.cli:main"
follow_api = "follow.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "follow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["follow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

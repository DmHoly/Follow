[project]
name = "follow"
version = "0.1.0"
description = "Git-like tracking for scientific experiments: intent, structure, evidence and conclusions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
follow = "follow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["follow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
